<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101a"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7"/>
    </marker>
  </defs>

  <rect width="1100" height="520" fill="url(#bgGrad3)"/>

  <!-- Title -->
  <g transform="translate(50, 36)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1.5"/>
    <text x="18" y="24" fill="#a855f7" font-size="16" font-weight="bold" text-anchor="middle">👑</text>
    <text x="48" y="20" fill="#ffffff" font-size="19" font-weight="700">Enterprise Lead Lifecycle &amp; Staff Distribution State Machine</text>
    <text x="48" y="36" fill="#94a3b8" font-size="12">Industrial CRM Multi-Tier Escalations, Round-Robin Queuing &amp; Human Takeover Protocol</text>
  </g>

  <!-- STATE 1: Inbound Lead Arrival -->
  <g transform="translate(50, 100)">
    <rect width="210" height="175" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="36" rx="12" fill="#1e293b" fill-opacity="0.6"/>
    <text x="14" y="23" fill="#cbd5e1" font-size="11.5" font-weight="700">1. NEW / UNCLAIMED</text>
    
    <g transform="translate(14, 48)">
      <text x="0" y="16" fill="#f8fafc" font-size="11" font-weight="600">Status: 'new'</text>
      <text x="0" y="34" fill="#94a3b8" font-size="10">• Inbound WhatsApp Lead</text>
      <text x="0" y="50" fill="#94a3b8" font-size="10">• assigned_to: NULL</text>
      <text x="0" y="66" fill="#94a3b8" font-size="10">• is_human_mode: FALSE</text>
      <text x="0" y="86" fill="#38bdf8" font-size="10">⚡ Automated Bot Handling</text>
      <text x="0" y="102" fill="#64748b" font-size="9.5">Answers FAQs &amp; Gathers Info</text>
    </g>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 260 185 L 305 185" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <!-- STATE 2: Bot Qualification & Triage -->
  <g transform="translate(305, 100)">
    <rect width="220" height="175" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="36" rx="12" fill="#0284c7" fill-opacity="0.15"/>
    <text x="14" y="23" fill="#38bdf8" font-size="11.5" font-weight="700">2. QUALIFIED / ROUTING</text>
    
    <g transform="translate(14, 48)">
      <text x="0" y="16" fill="#f8fafc" font-size="11" font-weight="600">Bot Data Enrichment</text>
      <text x="0" y="34" fill="#94a3b8" font-size="10">• Variables JSONB Captured</text>
      <text x="0" y="50" fill="#94a3b8" font-size="10">• Intent Keywords Flagged</text>
      <text x="0" y="66" fill="#94a3b8" font-size="10">• Lead Score Evaluated</text>
      <text x="0" y="86" fill="#10b981" font-size="10" font-weight="600">🎯 Round-Robin Allocation</text>
      <text x="0" y="102" fill="#64748b" font-size="9.5">or Open Lead Claim Pool</text>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 525 185 L 570 185" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <!-- STATE 3: Claimed & Staff Assignment -->
  <g transform="translate(570, 100)">
    <rect width="230" height="175" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="36" rx="12" fill="#8b5cf6" fill-opacity="0.15"/>
    <text x="14" y="23" fill="#c084fc" font-size="11.5" font-weight="700">3. CLAIMED / ENGAGED</text>
    
    <g transform="translate(14, 48)">
      <text x="0" y="16" fill="#f8fafc" font-size="11" font-weight="600">Status: 'contacted'</text>
      <text x="0" y="34" fill="#94a3b8" font-size="10">• assigned_to: UUID (Agent)</text>
      <text x="0" y="50" fill="#94a3b8" font-size="10">• claimed_at: NOW()</text>
      <text x="0" y="66" fill="#94a3b8" font-size="10">• First Response SLA Clock</text>
      <text x="0" y="86" fill="#fbbf24" font-size="10" font-weight="600">👤 Human Mode Activated</text>
      <text x="0" y="102" fill="#64748b" font-size="9.5">Bot Pauses; Staff in Control</text>
    </g>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 800 185 L 845 185" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <!-- STATE 4: Final Outcome / Conversion -->
  <g transform="translate(845, 100)">
    <rect width="205" height="175" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="205" height="36" rx="12" fill="#10b981" fill-opacity="0.15"/>
    <text x="14" y="23" fill="#34d399" font-size="11.5" font-weight="700">4. OUTCOME &amp; WON</text>
    
    <g transform="translate(14, 48)">
      <text x="0" y="16" fill="#f8fafc" font-size="11" font-weight="600">Deal Closed or Onboarded</text>
      <text x="0" y="34" fill="#94a3b8" font-size="10">• 'won' / 'approved'</text>
      <text x="0" y="50" fill="#94a3b8" font-size="10">• S3 Verified Documents</text>
      <text x="0" y="66" fill="#94a3b8" font-size="10">• Driver / Client Enrolled</text>
      <text x="0" y="86" fill="#10b981" font-size="10" font-weight="600">✓ CRM Conversion Complete</text>
      <text x="0" y="102" fill="#64748b" font-size="9.5">Excel / S3 Sync Export</text>
    </g>
  </g>

  <!-- BOTTOM SECTION: SLA Escalations & Hierarchy Management -->
  <g transform="translate(50, 310)">
    <rect width="1000" height="170" rx="14" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
    <rect x="0" y="0" width="1000" height="36" rx="14" fill="#ef4444" fill-opacity="0.12"/>
    <text x="20" y="23" fill="#f87171" font-size="12" font-weight="700">MULTI-LEVEL ESCALATION &amp; SLA GOVERNANCE ENGINE</text>
    <text x="750" y="23" fill="#fca5a5" font-size="11" font-weight="600">Zero Leads Left Behind</text>

    <!-- Sub-tier 1: Tier 1 Agent SLA -->
    <g transform="translate(24, 52)">
      <rect width="290" height="96" rx="8" fill="#131e33" stroke="#253550" stroke-width="1"/>
      <text x="14" y="22" fill="#ffffff" font-size="11" font-weight="700">Level 1: Staff Response Timeout</text>
      <text x="14" y="38" fill="#94a3b8" font-size="10">• If assigned lead is uncontacted &gt; 15 mins</text>
      <text x="14" y="54" fill="#94a3b8" font-size="10">• Auto WhatsApp nudge sent to staff agent</text>
      <text x="14" y="70" fill="#fca5a5" font-size="10">• Flags 'SLA_WARNING' in Activity Log</text>
      <text x="14" y="84" fill="#ef4444" font-size="9.5" font-weight="bold">⏱ Timer: 15 Minutes</text>
    </g>

    <!-- Sub-tier 2: Tier 2 Manager Escalation -->
    <g transform="translate(344, 52)">
      <rect width="310" height="96" rx="8" fill="#131e33" stroke="#253550" stroke-width="1"/>
      <text x="14" y="22" fill="#ffffff" font-size="11" font-weight="700">Level 2: Team Lead &amp; Re-allocation</text>
      <text x="14" y="38" fill="#94a3b8" font-size="10">• If lead remains uncontacted &gt; 30 mins</text>
      <text x="14" y="54" fill="#94a3b8" font-size="10">• Lead is revoked &amp; returned to Claim Pool</text>
      <text x="14" y="70" fill="#fca5a5" font-size="10">• Escalation alert sent to Manager Dashboard</text>
      <text x="14" y="84" fill="#ef4444" font-size="9.5" font-weight="bold">⏱ Timer: 30 Minutes</text>
    </g>

    <!-- Sub-tier 3: WhatsApp 24-Hour Policy Window -->
    <g transform="translate(684, 52)">
      <rect width="292" height="96" rx="8" fill="#131e33" stroke="#253550" stroke-width="1"/>
      <text x="14" y="22" fill="#ffffff" font-size="11" font-weight="700">Level 3: Meta 24-Hour Window</text>
      <text x="14" y="38" fill="#94a3b8" font-size="10">• Customer Care window active &lt; 24 hrs</text>
      <text x="14" y="54" fill="#94a3b8" font-size="10">• UI displays live countdown badge</text>
      <text x="14" y="70" fill="#a7f3d0" font-size="10">• Switch to Meta Templates once expired</text>
      <text x="14" y="84" fill="#10b981" font-size="9.5" font-weight="bold">🔒 Meta Cloud Strict Policy Guard</text>
    </g>
  </g>
</svg>
