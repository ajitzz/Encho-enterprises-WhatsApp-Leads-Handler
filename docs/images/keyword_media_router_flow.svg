<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111c"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
    <filter id="glowGreen2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
    <filter id="glowIndigo2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1100" height="620" fill="url(#bgGrad2)"/>

  <!-- Title Section -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="18" y="24" fill="#f59e0b" font-size="16" font-weight="bold" text-anchor="middle">🎯</text>
    <text x="48" y="20" fill="#ffffff" font-size="19" font-weight="700">Global Keyword Intent Router &amp; Multi-Asset Media Dispatcher</text>
    <text x="48" y="36" fill="#94a3b8" font-size="12">Natural Language Normalization, Semantic Token Stripping &amp; Sequential WhatsApp Pacing</text>
  </g>

  <!-- STEP 1: Inbound Customer WhatsApp Message -->
  <g transform="translate(50, 110)">
    <rect width="280" height="200" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="38" rx="12" fill="#1e293b" fill-opacity="0.6"/>
    <text x="16" y="24" fill="#10b981" font-size="12" font-weight="700">STEP 1: INBOUND WHATSAPP CHAT</text>

    <!-- Chat Bubble -->
    <g transform="translate(16, 52)">
      <rect width="248" height="65" rx="8" fill="#059669" fill-opacity="0.25" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="24" fill="#6ee7b7" font-size="10" font-weight="600">Customer Inbound Text:</text>
      <text x="14" y="44" fill="#ffffff" font-size="13" font-weight="bold">"send the property Number2"</text>
      <text x="14" y="56" fill="#94a3b8" font-size="9">(or "Property 2", "villa #2", "p2")</text>
    </g>

    <text x="16" y="145" fill="#cbd5e1" font-size="11" font-weight="600">Trigger Conditions:</text>
    <text x="16" y="162" fill="#94a3b8" font-size="10.5">• Interrupts any step in active linear flow</text>
    <text x="16" y="178" fill="#94a3b8" font-size="10.5">• Bypasses sequential question wait state</text>
    <text x="16" y="194" fill="#94a3b8" font-size="10.5">• Preserves active button click priorities</text>
  </g>

  <!-- Flow Arrow from Step 1 to Step 2 -->
  <path d="M 330 210 L 370 210" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- STEP 2: Intelligent Normalization & Token Matching -->
  <g transform="translate(370, 110)">
    <rect width="320" height="200" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#glowAmber)"/>
    <rect x="0" y="0" width="320" height="38" rx="12" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="16" y="24" fill="#fbbf24" font-size="12" font-weight="700">STEP 2: TOKEN STRIPPER &amp; MATCHER</text>

    <g transform="translate(16, 50)">
      <rect width="288" height="42" rx="6" fill="#131e33" stroke="#253550" stroke-width="1"/>
      <text x="12" y="18" fill="#94a3b8" font-size="10">Filler Word Stripping:</text>
      <text x="12" y="32" fill="#ef4444" font-size="10" text-decoration="line-through">send the number</text>
      <text x="110" y="32" fill="#10b981" font-size="10" font-weight="bold">→ ["property", "2"]</text>
    </g>

    <g transform="translate(16, 100)">
      <rect width="288" height="42" rx="6" fill="#131e33" stroke="#253550" stroke-width="1"/>
      <text x="12" y="18" fill="#94a3b8" font-size="10">Node Target Keywords:</text>
      <text x="12" y="32" fill="#38bdf8" font-size="11" font-mono="true">["property 2", "villa 2", "p2"]</text>
    </g>

    <text x="16" y="165" fill="#10b981" font-size="11" font-weight="bold">✓ 100% Deterministic Match Found!</text>
    <text x="16" y="182" fill="#94a3b8" font-size="10">Zero false positives: "hi" on "vehicle" is blocked.</text>
  </g>

  <!-- Flow Arrow from Step 2 to Step 3 -->
  <path d="M 690 210 L 730 210" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- STEP 3: Target Node Execution & Jump -->
  <g transform="translate(730, 110)">
    <rect width="320" height="200" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="38" rx="12" fill="#1e293b" fill-opacity="0.6"/>
    <text x="16" y="24" fill="#818cf8" font-size="12" font-weight="700">STEP 3: FLOW JUMP &amp; AUDIT LOG</text>

    <g transform="translate(16, 50)">
      <rect width="288" height="60" rx="6" fill="#131e33" stroke="#6366f1" stroke-width="1.2"/>
      <text x="12" y="20" fill="#a5b4fc" font-size="10" font-weight="700">TARGET NODE ACTIVATED:</text>
      <text x="12" y="38" fill="#ffffff" font-size="13" font-weight="bold">"Property 2 - Emerald Showcase"</text>
      <text x="12" y="52" fill="#818cf8" font-size="9.5">Node ID: node-prop-2 (Priority: 90)</text>
    </g>

    <g transform="translate(16, 122)">
      <text x="0" y="16" fill="#fcd34d" font-size="10.5" font-weight="600">Audit Trail Created:</text>
      <text x="0" y="32" fill="#cbd5e1" font-size="10">INSERT INTO lead_activity_log:</text>
      <text x="0" y="48" fill="#94a3b8" font-size="9.5" font-mono="true">'bot_keyword_triggered': "send the property Number2"</text>
      <text x="0" y="64" fill="#94a3b8" font-size="9.5">Manager &amp; staff see instant jump in Live CRM.</text>
    </g>
  </g>

  <!-- Flow Arrow from Top Row to Bottom Row -->
  <path d="M 890 310 L 890 350 L 550 350 L 550 380" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen2)"/>

  <!-- STEP 4: Multi-Asset Media Pack & Sequential WhatsApp Pacing (Full Width) -->
  <g transform="translate(50, 380)">
    <rect width="1000" height="200" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#glowGreen2)"/>
    <rect x="0" y="0" width="1000" height="38" rx="14" fill="#10b981" fill-opacity="0.15"/>
    <text x="20" y="24" fill="#34d399" font-size="13" font-weight="700">STEP 4: MULTI-ASSET SEQUENTIAL MEDIA DISPATCHER (PACED DELIVERY)</text>
    <text x="730" y="24" fill="#a7f3d0" font-size="11" font-weight="600">Prevents Out-Of-Order WhatsApp Delivery</text>

    <!-- Asset 1: Hero Image -->
    <g transform="translate(20, 52)">
      <rect width="220" height="128" rx="10" fill="#131e33" stroke="#253550" stroke-width="1"/>
      <rect x="12" y="12" width="24" height="24" rx="4" fill="#10b981"/>
      <text x="24" y="28" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1</text>
      <text x="44" y="24" fill="#ffffff" font-size="11.5" font-weight="700">Primary Hero Photo</text>
      <text x="44" y="37" fill="#34d399" font-size="9.5">Dispatched: T+0ms</text>
      <line x1="12" y1="46" x2="208" y2="46" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="64" fill="#cbd5e1" font-size="10">Villa Exterior &amp; Garden</text>
      <text x="12" y="80" fill="#94a3b8" font-size="9.5">• High-Res JPEG Link</text>
      <text x="12" y="96" fill="#94a3b8" font-size="9.5">• Custom Rich Caption</text>
      <text x="12" y="116" fill="#10b981" font-size="10" font-weight="600">✓ Delivered First</text>
    </g>

    <!-- Pacing 1 -->
    <g transform="translate(245, 100)">
      <text x="0" y="0" fill="#f59e0b" font-size="10" font-weight="bold">⏱ +350ms</text>
      <line x1="0" y1="10" x2="16" y2="10" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
    </g>

    <!-- Asset 2: Floor Plan Gallery -->
    <g transform="translate(268, 52)">
      <rect width="220" height="128" rx="10" fill="#131e33" stroke="#253550" stroke-width="1"/>
      <rect x="12" y="12" width="24" height="24" rx="4" fill="#0284c7"/>
      <text x="24" y="28" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2</text>
      <text x="44" y="24" fill="#ffffff" font-size="11.5" font-weight="700">Architectural Layout</text>
      <text x="44" y="37" fill="#38bdf8" font-size="9.5">Dispatched: T+350ms</text>
      <line x1="12" y1="46" x2="208" y2="46" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="64" fill="#cbd5e1" font-size="10">2D/3D Floor Plan Blueprint</text>
      <text x="12" y="80" fill="#94a3b8" font-size="9.5">• Media Gallery Item 1</text>
      <text x="12" y="96" fill="#94a3b8" font-size="9.5">• Dimension Specs</text>
      <text x="12" y="116" fill="#38bdf8" font-size="10" font-weight="600">✓ Delivered Second</text>
    </g>

    <!-- Pacing 2 -->
    <g transform="translate(493, 100)">
      <text x="0" y="0" fill="#f59e0b" font-size="10" font-weight="bold">⏱ +350ms</text>
      <line x1="0" y1="10" x2="16" y2="10" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
    </g>

    <!-- Asset 3: PDF Brochure Document -->
    <g transform="translate(516, 52)">
      <rect width="220" height="128" rx="10" fill="#131e33" stroke="#253550" stroke-width="1"/>
      <rect x="12" y="12" width="24" height="24" rx="4" fill="#d97706"/>
      <text x="24" y="28" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">3</text>
      <text x="44" y="24" fill="#ffffff" font-size="11.5" font-weight="700">Official PDF Brochure</text>
      <text x="44" y="37" fill="#fbbf24" font-size="9.5">Dispatched: T+700ms</text>
      <line x1="12" y1="46" x2="208" y2="46" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="64" fill="#cbd5e1" font-size="10">Property_Brochure.pdf</text>
      <text x="12" y="80" fill="#94a3b8" font-size="9.5">• Exact Document Filename</text>
      <text x="12" y="96" fill="#94a3b8" font-size="9.5">• S3 Cloud URL Preserved</text>
      <text x="12" y="116" fill="#fbbf24" font-size="10" font-weight="600">✓ Delivered Third</text>
    </g>

    <!-- Pacing 3 -->
    <g transform="translate(741, 100)">
      <text x="0" y="0" fill="#f59e0b" font-size="10" font-weight="bold">⏱ +350ms</text>
      <line x1="0" y1="10" x2="16" y2="10" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
    </g>

    <!-- Asset 4: Interactive CTA Buttons -->
    <g transform="translate(764, 52)">
      <rect width="216" height="128" rx="10" fill="#131e33" stroke="#6366f1" stroke-width="1.2"/>
      <rect x="12" y="12" width="24" height="24" rx="4" fill="#6366f1"/>
      <text x="24" y="28" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">4</text>
      <text x="44" y="24" fill="#ffffff" font-size="11.5" font-weight="700">Action Buttons</text>
      <text x="44" y="37" fill="#a5b4fc" font-size="9.5">Dispatched: T+1050ms</text>
      <line x1="12" y1="46" x2="204" y2="46" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="64" fill="#cbd5e1" font-size="10">🔘 [📅 Book a Site Visit]</text>
      <text x="12" y="82" fill="#cbd5e1" font-size="10">🔘 [💬 Speak to Manager]</text>
      <text x="12" y="100" fill="#cbd5e1" font-size="10">🔘 [💲 Pricing &amp; Offers]</text>
      <text x="12" y="116" fill="#a5b4fc" font-size="10" font-weight="600">✓ Bottom of Chat Feed</text>
    </g>
  </g>
</svg>
