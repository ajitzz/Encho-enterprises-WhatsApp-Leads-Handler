      <rect x="12" y="12" width="26" height="26" rx="6" fill="#d97706"/>
      <text x="25" y="29" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">🐘</text>
      <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Neon Postgres (Serverless)</text>
      <text x="46" y="38" fill="#fcd34d" font-size="10">System of Record</text>
      <line x1="12" y1="48" x2="216" y2="48" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="66" fill="#cbd5e1" font-size="10">• candidates / leads (State &amp; Step)</text>
      <text x="12" y="81" fill="#cbd5e1" font-size="10">• messages (Inbound/Outbound Audit)</text>
      <text x="12" y="96" fill="#cbd5e1" font-size="10">• lead_activity_log (FAANG Tracking)</text>
      <text x="12" y="111" fill="#cbd5e1" font-size="10">• staff_members &amp; assignments</text>
    </g>

    <!-- Staff Portal & Live Chat -->
    <g transform="translate(16, 192)">
