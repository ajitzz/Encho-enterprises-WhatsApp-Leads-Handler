  <!-- ================= CONNECTING FLOW ARROWS ================= -->
  <!-- Meta to Ingestion -->
  <path d="M 260 235 L 290 235" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" stroke-dasharray="4,4"/>
  
  <!-- Ingestion to Bot Engine -->
  <path d="M 530 235 L 560 235" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Bot Engine to Database -->
  <path d="M 850 180 L 880 180" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowIndigo)"/>
  
  <!-- Bot Engine Outbound Back to Meta -->
  <path d="M 560 410 C 440 460, 360 460, 260 300" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="360" y="450" fill="#34d399" font-size="11" font-weight="600">Outbound Paced WhatsApp Dispatch</text>

  <!-- Database to Staff Portal -->
  <path d="M 990 176 L 990 192" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>

</svg>
