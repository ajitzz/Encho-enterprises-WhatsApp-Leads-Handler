      <rect x="12" y="12" width="26" height="26" rx="6" fill="#8b5cf6"/>
      <text x="25" y="29" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">👥</text>
      <text x="46" y="24" fill="#ffffff" font-size="12" font-weight="700">Staff Portal &amp; Live Chat</text>
      <text x="46" y="38" fill="#d8b4fe" font-size="10">React 18 + Tailwind + Lucide</text>
      <line x1="12" y1="48" x2="216" y2="48" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="66" fill="#cbd5e1" font-size="10">• 24-Hour WhatsApp Session Timer</text>
      <text x="12" y="81" fill="#cbd5e1" font-size="10">• Seamless Human Takeover Toggle</text>
      <text x="12" y="96" fill="#cbd5e1" font-size="10">• Auto Lead Assignment (Round Robin)</text>
      <text x="12" y="111" fill="#cbd5e1" font-size="10">• Quick Replies &amp; Document Review</text>
      <text x="12" y="126" fill="#cbd5e1" font-size="10">• Real-time Sync via SSE / REST</text>
    </g>

    <!-- AWS S3 Media Storage -->
    <g transform="translate(16, 348)">
      <rect width="228" height="115" rx="10" fill="#131e33" stroke="#253550" stroke-width="1"/>
      <text x="16" y="25" fill="#f8fafc" font-size="12" font-weight="600">AWS S3 Media Storage</text>
      <text x="16" y="40" fill="#94a3b8" font-size="10">Presigned Uploads &amp; Retrieval</text>
      <line x1="16" y1="50" x2="212" y2="50" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="68" fill="#94a3b8" font-size="9.5">• Property Brochures (PDFs)</text>
      <text x="16" y="83" fill="#94a3b8" font-size="9.5">• High-Res Villas, Real Estate &amp; Cars</text>
      <text x="16" y="98" fill="#94a3b8" font-size="9.5">• Driver Licences &amp; ID Proofs</text>
    </g>
